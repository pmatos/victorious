name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg and tesseract
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-whisper-small-yamnet-pyannote-v1
      - run: uv sync --locked --group dev
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy .
      - name: Choose the tests to run
        env:
          EVENT: ${{ github.event_name }}
        # The tests that load the real speech models run on main, nightly, on demand and when a
        # pull request touches a path in slow-models-paths.txt (HEAD^1 is the merge commit's base).
        run: |
          models=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
            needed=0
            printf '%s\n' "$changed" | .github/scripts/slow-models-needed.sh || needed=$?
            if [ "$needed" = 1 ]; then
              models=false
              echo 'PYTEST_ADDOPTS=-m "not slow_models"' >> "$GITHUB_ENV"
            fi
          fi
          echo "model tests: $models"
      - run: uv run pytest --durations=25 --cov=. --cov-report=term-missing
