name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg and tesseract
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-whisper-large-v3-turbo-yamnet-pyannote-v1
      - run: uv sync --locked --group dev
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy .
      - name: Choose the tests to run
        env:
          EVENT: ${{ github.event_name }}
        # Pull requests and pushes run the fast tier on 2 workers (each test already fans out over
        # every CPU, so more workers only oversubscribe the runner): no `e2e` tests (the whole pipeline
        # on built Recordings), no coverage, and no `slow_models` tests unless a pull request touches
        # a path in slow-models-paths.txt (HEAD^1 is the merge commit's base). The nightly run and
        # workflow_dispatch run everything, serially, with coverage.
        run: |
          case "$EVENT" in
            schedule | workflow_dispatch)
              echo "tests: all"
              echo "PYTEST_ADDOPTS=--cov=. --cov-report=term-missing" >> "$GITHUB_ENV"
              ;;
            *)
              markers='not e2e and not slow_models'
              workers=2
              if [ "$EVENT" = pull_request ]; then
                changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
                needed=0
                printf '%s\n' "$changed" | .github/scripts/slow-models-needed.sh || needed=$?
                if [ "$needed" != 1 ]; then
                  markers='not e2e'
                fi
              fi
              echo "tests: $markers, $workers workers"
              echo "PYTEST_ADDOPTS=-m \"$markers\" -n $workers" >> "$GITHUB_ENV"
              ;;
          esac
      - run: uv run pytest --durations=25
