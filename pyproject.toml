[project]
name = "victorious"
version = "0.1.0"
description = "Find Matches, Wins and speech in long Fortnite gameplay Recordings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.31.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.0",
    "pyannote-audio>=4.0.7",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]

[project.scripts]
victorious = "victorious.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/victorious"]

[dependency-groups]
dev = [
    "hypothesis>=6.156.6",
    "jsonschema>=4.26.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.21",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 12 wheels on Windows: they also ship the cuBLAS and cuDNN 9 DLLs that faster-whisper's
# CTranslate2 loads, so an NVIDIA GPU needs only its driver.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.mypy]
files = ["."]
strict = true

[[tool.mypy.overrides]]
module = ["cv2.*", "ctranslate2.*", "faster_whisper.*", "onnxruntime.*", "pyannote.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: runs the whole pipeline on built Recordings; CI runs it nightly and on demand, not on pull requests or pushes",
    "slow_models: loads the real Whisper, YAMNet or pyannote models; CI skips it on pull requests that leave the speech code alone",
]

[tool.coverage.run]
# cv2 exec's these by relative path, so coverage misattributes them to the repo root.
omit = ["tests/*", "*/config.py", "*/config-3.py"]
