[project]
name = "victorious"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "hypothesis>=6.156.6",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.mypy]
files = ["."]
strict = true

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
# cv2 exec's these by relative path, so coverage misattributes them to the repo root.
omit = ["tests/*", "*/config.py", "*/config-3.py"]
