[project]
name = "victorious"
version = "0.1.0"
description = "Find Matches, Wins and speech in long Fortnite gameplay Recordings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
victorious = "victorious.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/victorious"]

[dependency-groups]
dev = [
    "hypothesis>=6.156.6",
    "jsonschema>=4.26.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.mypy]
files = ["."]
strict = true

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# cv2 exec's these by relative path, so coverage misattributes them to the repo root.
omit = ["tests/*", "*/config.py", "*/config-3.py"]
